name: cajoo

services:
  fabrica-cajoo-prod-db:
    container_name: fabrica-cajoo-prod-db
    image: postgres:16-alpine
    env_file: .env
    environment:
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - fabrica-cajoo-prod-db:/var/lib/postgresql/data
    networks:
      - fabrica-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 3

  fabrica-cajoo-prod-web:
    container_name: fabrica-cajoo-prod-web
    build:
      context: .
      target: prod
      args:
        APP_VERSION: ${APP_VERSION:-latest}
        APP_ENV: production
    image: fabrica-cajoo:${APP_VERSION:-latest}
    # ports:
    #   - "9092:3000" # escolha uma porta livre no host, se for expor direto (sem proxy reverso)
    depends_on:
      fabrica-cajoo-prod-db:
        condition: service_healthy
    env_file: .env
    environment:
      - APP_ENV=production
      - PORT=3000
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-https://cajoo.fsw-ifc.brdrive.cloud}
      - APP_VERSION=${APP_VERSION:-latest}
      - POSTGRES_HOST=fabrica-cajoo-prod-db
      - POSTGRES_PORT=5432
    labels:
      - org.opencontainers.image.version=${APP_VERSION:-latest}
      - org.opencontainers.image.revision=${APP_REVISION:-local}
    networks:
      - fabrica-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  fabrica-cajoo-migrate:
    profiles: ['tools']
    build:
      context: .
      target: migrate
    image: fabrica-cajoo-migrate:${APP_VERSION:-latest}
    env_file: .env
    environment:
      POSTGRES_HOST: fabrica-cajoo-prod-db
      POSTGRES_PORT: 5432
      APP_VERSION: ${APP_VERSION:-latest}
    networks:
      - fabrica-network
    restart: 'no'

volumes:
  fabrica-cajoo-prod-db:

networks:
  fabrica-network:
    external: true
