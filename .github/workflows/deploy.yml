name: Continuous Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      database_only:
        description: 'Aplicar apenas SQLs, sem atualizar o container web'
        type: boolean
        default: false

permissions:
  contents: read

# Não interromper uma migração por causa de outro push.
concurrency:
  group: fabrica-cajoo-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: Atualizar CAJOO na BRDrive
    runs-on: self-hosted
    steps:
      - name: Checkout (inclui db/migrations e scripts)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detectar atualização exclusiva do banco
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_ONLY_INPUT: ${{ inputs.database_only }}
        run: |
          set -euo pipefail
          DATABASE_ONLY=false
          DEPLOYED_SHA=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' fabrica-cajoo-prod-web 2>/dev/null || true)
          if [[ "$DATABASE_ONLY_INPUT" == 'true' ]]; then
            DATABASE_ONLY=true
          elif [[ "$EVENT_NAME" == 'push' && "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "$DEPLOYED_SHA^{commit}" 2>/dev/null; then
            # SQLs estão na imagem de migração; não há motivo para reiniciar o site.
            OTHER_CHANGES=$(git diff --name-only "$DEPLOYED_SHA" "$GITHUB_SHA" -- . ':!db/**' ':!scripts/migrate.js')
            if [[ -z "$OTHER_CHANGES" ]]; then DATABASE_ONLY=true; fi
          fi
          echo "DATABASE_ONLY=$DATABASE_ONLY" >> "$GITHUB_ENV"

      - name: Definir versão e preparar ambiente
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$ENV_FILE" || { echo 'Secret ENV_FILE não configurado'; exit 1; }
          umask 077
          APP_VERSION="sha-${GITHUB_SHA:0:12}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          printf '%s\n' "$ENV_FILE" | sed '/^APP_VERSION=/d; /^APP_ENV=/d; /^APP_REVISION=/d' > .env
          printf '\nAPP_VERSION=%s\nAPP_ENV=production\nAPP_REVISION=%s\n' "$APP_VERSION" "$GITHUB_SHA" >> .env
          docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Preparar executor com os SQLs atualizados
        run: docker compose -f "$COMPOSE_FILE" build fabrica-cajoo-migrate

      - name: Preparar site
        if: ${{ env.DATABASE_ONLY != 'true' }}
        run: docker compose -f "$COMPOSE_FILE" build fabrica-cajoo-prod-web

      - name: Garantir banco disponível sem recriar o container existente
        run: docker compose -f "$COMPOSE_FILE" up -d --no-recreate --wait --wait-timeout 120 fabrica-cajoo-prod-db

      - name: Consultar histórico e aplicar migrações pendentes
        # Falhas interrompem o job antes de substituir o site em execução.
        run: docker compose -f "$COMPOSE_FILE" run --rm --no-deps fabrica-cajoo-migrate

      - name: Atualizar somente o site
        if: ${{ env.DATABASE_ONLY != 'true' }}
        run: docker compose -f "$COMPOSE_FILE" up -d --no-deps --no-build --wait --wait-timeout 120 fabrica-cajoo-prod-web

      - name: Status final
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps
